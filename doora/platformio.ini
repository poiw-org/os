; Doora door controller. Build with `pio run`, flash with `pio run -t upload`, console with `pio device monitor`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
; Max clocks: 240 MHz CPU, 80 MHz quad-I/O flash.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
; The unit tests in host_test/ run on the workstation (`make test`), not on the board.
test_ignore = *

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -Ivendor/micro-ecc

; The door builds everything in src/ except the bridge's own files (src/bridge/), plus micro-ecc for
; the phone's ECDSA proof. The bridge env below shares BridgeLink with it.
build_src_filter =
    +<*>
    -<bridge/>
    +<../vendor/micro-ecc/ecc_p256.c>

; Bluetooth makes the image about 1.8 MB, so this table has two 1.9 MB app slots (firmware updates
; need both) and 128 KB of LittleFS, plenty for the journal, blacklist and clock. A partition table
; can only be changed over USB.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; The BLE bridge: an ESP32-C3 Super Mini that carries bytes between a phone and the door over UART
; (docs/ble-protocol.md). Same project, other firmware: `make build ENV=bridge`,
; `make upload ENV=bridge`. See src/bridge/README.md. It holds no keys and no settings.
[env:bridge]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
test_ignore = *
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    ; The Super Mini's USB port is the native USB serial, which leaves UART0 (GPIO 20/21) for the link.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; The BLE callbacks build UART frames (about 2.2 KB of buffers) on the host task's stack; the
    ; default 4 KB leaves too little under them.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    -DBRIDGE_FIRMWARE_VERSION=\"1.0.0\"
build_src_filter =
    -<*>
    +<bridge/>
    +<BridgeLink.cpp>
