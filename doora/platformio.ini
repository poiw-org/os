; Doora door controller. Build with `pio run`, flash with `pio run -t upload`, console with `pio device monitor`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
; Max clocks: 240 MHz CPU, 80 MHz quad-I/O flash.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
; The unit tests in host_test/ run on the workstation (`make test`), not on the board.
test_ignore = *

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0

; LittleFS in the default 4 MB partition table is enough for the journal, blacklist and clock.
board_build.filesystem = littlefs
; Signs firmware.bin for updates over Wi-Fi (tools/ota.py). The default partition table already has
; two app slots, which OTA needs.
extra_scripts = post:tools/ota.py

; Updates over Wi-Fi: `pio run -e ota -t upload` (README.md, "Updates over Wi-Fi"). Only images signed
; with the key in ~/.doora are accepted. Set upload_port to the door's name ("doora-<door id>.local")
; or IP, or pass --upload-port.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = doora-front.local
